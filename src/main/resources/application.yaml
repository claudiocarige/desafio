spring:
  application:
    name: desafio
#### Spring Security
  security:
    user:
      name: desafio-dantum
      password: 123456

#### Banco H2
  datasource:
    url: jdbc:h2:file:./data/desafio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

