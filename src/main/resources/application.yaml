spring:
  application:
    name: desafio

#### Banco H2
  datasource:
    url: jdbc:h2:mem:desafio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

score:
  service:
    base-url: http://localhost:3000
    timeout-ms: 5000

app:
  security:
    user:
      name: user-dantum
      password: user123
    admin:
      name: admin-dantum
      password: admin123
